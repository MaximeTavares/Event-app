name: Gateway - CI/CD

on:
  push:
    branches:
      - develop

    paths:
      - "apps/gateway/**"

  workflow_dispatch:

  pull_request:
    branches:
      - develop
      - main

jobs:

  quality:
    if: github.event_name == 'pull_request'

    uses: ./.github/workflows/quality.yml

    with:
      working-directory: apps/gateway
      prisma-generate: true
      sonar-project-key: ${{ vars.SONAR_GATEWAY_PROJECT_KEY }}

  build:
    if: github.event_name != 'pull_request'

    uses: ./.github/workflows/docker-build.yml

    with:
      context: apps/gateway
      image-name: gateway

  deploy-staging:
    if: github.ref == 'refs/heads/develop'

    needs: build

    uses: ./.github/workflows/deploy.yml

    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-gateway
      image-name: gateway
      network: nginx-staging
      run-migrations: true