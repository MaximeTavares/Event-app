name: Front - CI/CD

on:
  push:
    branches: [develop]
    paths:
      - "apps/front/**"
      - "packages/contracts/**"

  workflow_dispatch:

  pull_request:
    branches: [develop, main]
    paths:
      - "apps/front/**"
      - "packages/contracts/**"

jobs:

  quality:
    if: github.event_name == 'pull_request'

    uses: ./.github/workflows/quality.yml
    with:
      package: front
      sonar-source: apps/front
      sonar-project-key: ${{ vars.SONAR_FRONT_PROJECT_KEY }}

  build-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push STAGING Front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/front/Dockerfile
          push: true

          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL_STAGING }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}

          tags: |
            ghcr.io/${{ env.OWNER }}/front:${{ github.sha }}



  build-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push PROD Front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/front/Dockerfile

          push: true

          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}

          tags: |
            ghcr.io/${{ env.OWNER }}/front:${{ github.sha }}


  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: build-staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy STAGING
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            cd /opt/event-app/staging

            IMAGE=ghcr.io/${OWNER}/front:${{ github.sha }}

            echo "Pulling image..."
            docker pull $IMAGE

            echo "Deploying front..."
            IMAGE_TAG=${{ github.sha }} docker compose up -d staging-front --remove-orphans

            echo "Cleanup..."
            docker image prune -f


  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-prod
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy PROD
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            cd /opt/event-app/prod

            IMAGE=ghcr.io/${OWNER}/front:${{ github.sha }}

            echo "Pulling image..."
            docker pull $IMAGE

            echo "Deploying front..."
            IMAGE_TAG=${{ github.sha }} docker compose up -d prod-front --remove-orphans

            echo "Cleanup..."
            docker image prune -f