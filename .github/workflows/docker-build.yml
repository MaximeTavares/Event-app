name: Docker Build

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string

      image-name:
        required: true
        type: string

      file:
        required: true
        type: string

      build-args:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file}}

          push: true

          build-args: ${{ inputs.build-args}}

          tags: |
            ghcr.io/${{ env.OWNER }}/${{ inputs.image-name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/${{ inputs.image-name }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max