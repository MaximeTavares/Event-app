name: Release

on:
  push:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      service:
        description: "Service à deploy (gateway | auth | front | all)"
        required: true
        default: "all"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

##########################
## DETECT CHANGES
##########################
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      front: ${{ steps.filter.outputs.front }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            gateway:
              - 'apps/gateway/**'
              - 'packages/contracts/**'
              - 'packages/database/**'

            auth:
              - 'services/ms-auth/**'
              - 'packages/contracts/**'

            front:
              - 'apps/front/**'
              - 'packages/contracts/**'

##########################
## BUILDS
##########################

  build-gateway:
    needs: detect-changes

    if: |
      needs.detect-changes.outputs.gateway == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'gateway' || inputs.service == 'all'))

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/docker-build.yml

    with:
      context: .
      image-name: gateway
      file: apps/gateway/Dockerfile

  build-auth:
    needs: detect-changes

    if: |
      needs.detect-changes.outputs.auth == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'auth' || inputs.service == 'all'))

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/docker-build.yml

    with:
      context: .
      image-name: ms-auth
      file: services/ms-auth/Dockerfile

  build-front:
    needs: detect-changes

    if: |
      needs.detect-changes.outputs.front == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'front' || inputs.service == 'all'))

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/docker-build.yml

    with:
      context: .
      image-name: front
      file: apps/front/Dockerfile
      build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL_STAGING }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GEOAPIFY_API_KEY=${{ vars.GEOAPIFY_API_KEY }}

##########################
## BUILD GATE
##########################
  build-gate:
    needs: [build-gateway, build-auth, build-front]
    runs-on: ubuntu-latest

    if: always()

    steps:
      - name: Validate atomic build
        run: |
          echo "gateway=${{ needs.build-gateway.result }}"
          echo "auth=${{ needs.build-auth.result }}"
          echo "front=${{ needs.build-front.result }}"

          for r in \
            "${{ needs.build-gateway.result }}" \
            "${{ needs.build-auth.result }}" \
            "${{ needs.build-front.result }}"; do

            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ Atomic release blocked"
              exit 1
            fi
          done

          echo "✅ Atomic build OK → deploy allowed"

##########################
## DEPLOYS
##########################

  deploy-gateway:
    needs: [detect-changes, build-gate]

    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.detect-changes.outputs.gateway == 'true' &&
          needs.build-gate.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.service == 'gateway' || inputs.service == 'all')
        )
      )

    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-gateway
      environment: staging
      image-name: gateway
      network: nginx-staging

  deploy-auth:
    needs: [detect-changes, build-gate]
    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.detect-changes.outputs.auth == 'true' &&
          needs.build-gate.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.service == 'auth' || inputs.service == 'all')
        )
      )
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-ms-auth
      environment: staging
      image-name: ms-auth
      network: nginx-staging

  deploy-front:
    needs: [detect-changes, build-gate]
    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.detect-changes.outputs.front == 'true' &&
          needs.build-gate.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.service == 'front' || inputs.service == 'all')
        )
      )
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-front
      environment: staging
      image-name: front
      network: nginx-staging

##########################
## DEPLOY GATE
##########################
  deploy-gate:
    needs: [deploy-gateway, deploy-auth, deploy-front]
    runs-on: ubuntu-latest

    if: always()

    outputs:
      rollback-needed: ${{ steps.check.outputs.rollback_needed }}

    steps:
      - name: Check deploy results
        id: check
        run: |
          echo "gateway=${{ needs.deploy-gateway.result }}"
          echo "auth=${{ needs.deploy-auth.result }}"
          echo "front=${{ needs.deploy-front.result }}"

          for r in \
            "${{ needs.deploy-gateway.result }}" \
            "${{ needs.deploy-auth.result }}" \
            "${{ needs.deploy-front.result }}"; do

            if [[ "$r" == "failure" ]]; then
              echo "❌ Un déploiement a échoué → rollback nécessaire"
              echo "rollback_needed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "✅ Tous les déploiements ont réussi"
          echo "rollback_needed=false" >> "$GITHUB_OUTPUT"

##########################
## ROLLBACKS
##########################

  rollback-gateway:
    needs: [deploy-gateway, deploy-gate]

    if: |
      always() &&
      needs.deploy-gate.outputs.rollback-needed == 'true' &&
      needs.deploy-gateway.result != 'skipped'

    uses: ./.github/workflows/rollback.yml

    secrets: inherit

    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-gateway
      environment: staging
      target-sha: ${{ needs.deploy-gateway.outputs.previous-sha }}

  rollback-auth:
    needs: [deploy-auth, deploy-gate]

    if: |
      always() &&
      needs.deploy-gate.outputs.rollback-needed == 'true' &&
      needs.deploy-auth.result != 'skipped'

    uses: ./.github/workflows/rollback.yml

    secrets: inherit

    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-ms-auth
      environment: staging
      target-sha: ${{ needs.deploy-auth.outputs.previous-sha }}

  rollback-front:
    needs: [deploy-front, deploy-gate]

    if: |
      always() &&
      needs.deploy-gate.outputs.rollback-needed == 'true' &&
      needs.deploy-front.result != 'skipped'

    uses: ./.github/workflows/rollback.yml

    secrets: inherit

    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-front
      environment: staging
      target-sha: ${{ needs.deploy-front.outputs.previous-sha }}

##########################
## ROLLBACK GATE (vérifie que les rollbacks ont bien fonctionné)
##########################
  rollback-gate:
    needs: [rollback-gateway, rollback-auth, rollback-front]
    runs-on: ubuntu-latest

    if: always() && needs.deploy-gate.outputs.rollback-needed == 'true'

    steps:
      - name: Check rollback results
        run: |
          echo "rollback-gateway=${{ needs.rollback-gateway.result }}"
          echo "rollback-auth=${{ needs.rollback-auth.result }}"
          echo "rollback-front=${{ needs.rollback-front.result }}"

          FAILED=false

          for r in \
            "${{ needs.rollback-gateway.result }}" \
            "${{ needs.rollback-auth.result }}" \
            "${{ needs.rollback-front.result }}"; do

            if [[ "$r" == "failure" ]]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "::error::🚨 ROLLBACK FAILED — l'infra est dans un état incohérent, intervention manuelle requise immédiatement"
            exit 1
          fi

          echo "✅ Rollback réussi sur tous les services concernés — infra revenue à un état cohérent"