name: Release

on:
  push:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      service:
        description: "Service à deploy (gateway | auth | front | all)"
        required: true
        default: "all"

jobs:

##########################
## DETECT CHANGES
##########################
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      front: ${{ steps.filter.outputs.front }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            gateway:
              - 'apps/gateway/**'
              - 'packages/contracts/**'
              - 'packages/database/**'

            auth:
              - 'services/ms-auth/**'
              - 'packages/contracts/**'

            front:
              - 'apps/front/**'
              - 'packages/contracts/**'

##########################
## BUILDS
##########################

  build-gateway:
    needs: detect-changes

    if: needs.detect-changes.outputs.gateway == 'true'

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/docker-build.yml

    with:
      context: .
      image-name: gateway
      file: apps/gateway/Dockerfile

  build-auth:
    needs: detect-changes

    if: needs.detect-changes.outputs.auth == 'true'

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/docker-build.yml

    with:
      context: .
      image-name: ms-auth
      file: services/ms-auth/Dockerfile

  build-front:
    needs: detect-changes

    if: needs.detect-changes.outputs.front == 'true'

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/docker-build.yml

    with:
      context: .
      image-name: front
      file: apps/front/Dockerfile
      build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL_STAGING }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GEOAPIFY_API_KEY=${{ vars.GEOAPIFY_API_KEY }}

##########################
## BUILD GATE
##########################
  build-gate:
    needs: [build-gateway, build-auth, build-front]
    runs-on: ubuntu-latest

    if: always()

    steps:
      - name: Validate atomic build
        run: |
          echo "gateway=${{ needs.build-gateway.result }}"
          echo "auth=${{ needs.build-auth.result }}"
          echo "front=${{ needs.build-front.result }}"

          for r in \
            "${{ needs.build-gateway.result }}" \
            "${{ needs.build-auth.result }}" \
            "${{ needs.build-front.result }}"; do

            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ Atomic release blocked"
              exit 1
            fi
          done

          echo "✅ Atomic build OK → deploy allowed"

##########################
## DEPLOYS
##########################

  deploy-gateway:
    needs: [detect-changes, build-gate]

    if: |
      (
        github.event_name == 'push' &&
        needs.detect-changes.outputs.gateway == 'true' &&
        needs.build-gate.result == 'success'
      )
      ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.service == 'gateway' || inputs.service == 'all')
      )

    uses: ./.github/workflows/deploy.yml

    secrets: inherit

    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-gateway
      environment: staging
      image-name: gateway
      network: nginx-staging

  deploy-auth:
    needs: [detect-changes, build-gate]

    if: |
      (
        github.event_name == 'push' &&
        needs.detect-changes.outputs.auth == 'true' &&
        needs.build-gate.result == 'success'
      )
      ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.service == 'auth' || inputs.service == 'all')
      )

    uses: ./.github/workflows/deploy.yml

    secrets: inherit

    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-ms-auth
      environment: staging
      image-name: ms-auth
      network: nginx-staging

  deploy-front:
    needs: [detect-changes, build-gate]

    if: |
      (
        github.event_name == 'push' &&
        needs.detect-changes.outputs.front == 'true' &&
        needs.build-gate.result == 'success'
      )
      ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.service == 'front' || inputs.service == 'all')
      )

    uses: ./.github/workflows/deploy.yml

    secrets: inherit

    with:
      compose-directory: /opt/event-app/staging
      compose-service: staging-front
      environment: staging
      image-name: front
      network: nginx-staging