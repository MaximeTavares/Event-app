name: Deploy

on:
  workflow_call:
    inputs:
      compose-directory:
        required: true
        type: string

      compose-service:
        required: true
        type: string

      image-name:
        required: true
        type: string

      network:
        required: false
        type: string
        default: ""

      environment:
        required: true
        type: string

    secrets:
      EC2_HOST:
        required: true
      EC2_KEY:
        required: true

    outputs:
      previous-sha:
        description: "SHA déployé avant ce run (vide si premier déploiement)"
        value: ${{ jobs.deploy.outputs.previous-sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      previous-sha: ${{ steps.parse.outputs.previous_sha }}

    steps:
      - name: Read previous deployed SHA
        id: read-sha
        uses: appleboy/ssh-action@v1.2.1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          capture_stdout: true

          script: |
            cd ${{ inputs.compose-directory }}
            SHA_FILE=".deployed-${{ inputs.compose-service }}-sha"
            if [ -f "$SHA_FILE" ]; then
              SHA_CONTENT=$(cat "$SHA_FILE")
            else
              SHA_CONTENT=""
            fi
            echo "PREVIOUS_SHA_MARKER::${SHA_CONTENT}::END_MARKER"

      - name: Parse previous SHA
        id: parse
        run: |
          RAW="${{ steps.read-sha.outputs.stdout }}"
          PREVIOUS_SHA=$(echo "$RAW" | grep -o 'PREVIOUS_SHA_MARKER::[^:]*::END_MARKER' | sed 's/PREVIOUS_SHA_MARKER:://;s/::END_MARKER//')
          echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
          echo "Previous SHA: ${PREVIOUS_SHA:-none}"

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            cd ${{ inputs.compose-directory }}

            IMAGE=ghcr.io/${OWNER}/${{ inputs.image-name }}:${{ github.sha }}
            SHA_FILE=".deployed-${{ inputs.compose-service }}-sha"

            echo "Pulling image..."
            docker pull $IMAGE

            echo "Deploying container..."
            IMAGE_TAG=${{ github.sha }} docker compose up -d ${{ inputs.compose-service }} --remove-orphans --wait --wait-timeout 60

            echo "${{ github.sha }}" > "$SHA_FILE"

            echo "Cleanup images..."
            docker image prune -f