name: Deploy

on:
  workflow_call:
    inputs:
      compose-directory:
        required: true
        type: string

      compose-service:
        required: true
        type: string

      image-name:
        required: true
        type: string

      network:
        required: false
        type: string
        default: ""

      environment:
        required: true
        type: string

    secrets:
      EC2_HOST:
        required: true
      EC2_KEY:
        required: true

    outputs:
      previous-sha:
        description: "SHA déployé avant ce run (vide si premier déploiement)"
        value: ${{ jobs.deploy.outputs.previous-sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      previous-sha: ${{ steps.deploy.outputs.previous_sha }}

    steps:
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            cd ${{ inputs.compose-directory }}

            IMAGE=ghcr.io/${OWNER}/${{ inputs.image-name }}:${{ github.sha }}
            SHA_FILE=".deployed-${{ inputs.compose-service }}-sha"

            # Capture le SHA actuellement déployé, AVANT de le remplacer
            if [ -f "$SHA_FILE" ]; then
              PREVIOUS_SHA=$(cat "$SHA_FILE")
            else
              PREVIOUS_SHA=""
            fi
            echo "Previous SHA: ${PREVIOUS_SHA:-none}"
            echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"

            echo "Pulling image..."
            docker pull $IMAGE

            echo "Deploying container..."
            IMAGE_TAG=${{ github.sha }} docker compose up -d ${{ inputs.compose-service }} --remove-orphans --wait --wait-timeout 60

            # On n'écrit le nouveau SHA QUE si le déploiement a réussi
            echo "${{ github.sha }}" > "$SHA_FILE"

            echo "Cleanup images..."
            docker image prune -f